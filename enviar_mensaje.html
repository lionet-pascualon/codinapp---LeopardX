{% extends 'app_pages/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card bg-dark text-white p-4 border-warning shadow">
        <h2 class="text-primary mb-4" style="color: #d4af37 !important;">Nuevo Mensaje</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label" style="color: #d4af37;">Escribe el nombre del destinatario:</label>
                <input type="text" 
                       list="user-list" 
                       name="receptor_nombre" 
                       class="form-control bg-dark text-white border-warning" 
                       placeholder="Empieza a escribir... (ej: Victoria)" 
                       autocomplete="off"
                       required>
                
                <datalist id="user-list">
                    {% for u in usuarios %}
                        <option value="{{ u.username }}">
                    {% endfor %}
                </datalist>
                <small class="text-warning">Si el usuario existe, aparecerá en la lista mientras escribes.</small>
            </div>

            <div class="mb-3">
                <label class="form-label" style="color: #d4af37;">Mensaje:</label>
                <textarea name="contenido" 
                          class="form-control bg-dark text-white border-warning" 
                          rows="4" 
                          placeholder="Escribe tu mensaje aquí..." 
                          required></textarea>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" style="background-color: #d4af37; border: none; color: black; font-weight: bold;">
                    Enviar Mensaje 🚀
                </button>
                <a href="{% url 'bandeja_entrada' %}" class="btn btn-outline-secondary btn-sm">Volver</a>
            </div>
        </form>

        {% if error %}
            <div class="alert alert-danger mt-3 bg-danger text-white border-0">
                {{ error }}
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
